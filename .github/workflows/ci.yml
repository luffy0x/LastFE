name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm exec playwright test
      - name: Remove the disposable Playwright Next.js output
        run: rm -rf .next-e2e
      - run: pnpm build

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux application image target
        run: >-
          docker buildx build
          --platform linux/amd64
          --target app
          --tag knowledge-frontier-app:ci-${{ github.sha }}
          --load
          web
      - name: Build the Linux maintenance image target
        run: >-
          docker buildx build
          --platform linux/amd64
          --target maintenance
          --tag knowledge-frontier-maintenance:ci-${{ github.sha }}
          --load
          web
      - name: Validate Compose image selection and rendered configuration
        env:
          APP_IMAGE: knowledge-frontier-app:ci-${{ github.sha }}
          MAINTENANCE_IMAGE: knowledge-frontier-maintenance:ci-${{ github.sha }}
          APP_ENV_FILE: ./deploy/.env.example
        run: docker compose config
      - name: Parse the Nginx configuration
        shell: pwsh
        run: ./deploy/nginx/test-config.ps1
      - name: Install the ephemeral SQLite test dependency
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Verify SQLite backup and restore round trip
        run: bash deploy/scripts/test-backup.sh
      - name: Validate systemd units
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
