name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm exec playwright test
      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the disposable Playwright Next.js output
        run: rm -rf .next-e2e
      - run: pnpm build

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the structural Dockerfile guard
        run: node web/Dockerfile.test.mjs
      - name: Build the Linux application image target
        run: >-
          docker buildx build
          --platform linux/amd64
          --target app
          --tag knowledge-frontier-app:ci-${{ github.sha }}
          --load
          web
      - name: Build the Linux maintenance image target
        run: >-
          docker buildx build
          --platform linux/amd64
          --target maintenance
          --tag knowledge-frontier-maintenance:ci-${{ github.sha }}
          --load
          web
      - name: Inspect image configuration and history
        env:
          APP_IMAGE: knowledge-frontier-app:ci-${{ github.sha }}
          MAINTENANCE_IMAGE: knowledge-frontier-maintenance:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$APP_IMAGE" --format '{{.Config.User}}')" = nextjs
          test "$(docker image inspect "$MAINTENANCE_IMAGE" --format '{{.Config.User}}')" = nextjs
          for image in "$APP_IMAGE" "$MAINTENANCE_IMAGE"; do
            metadata="$({
              docker image inspect "$image" --format '{{json .Config}}'
              docker history "$image" --no-trunc --format '{{.CreatedBy}}'
            })"
            if printf '%s\n' "$metadata" | grep -Eiq 'GITHUB_TOKEN|GITHUB_WEBHOOK_SECRET|ALTCHA_HMAC_KEY|RATE_LIMIT_HMAC_KEY'; then
              echo "secret-bearing configuration found in $image metadata or history" >&2
              exit 1
            fi
          done
      - name: Smoke-test the maintenance image runtime
        env:
          MAINTENANCE_IMAGE: knowledge-frontier-maintenance:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$MAINTENANCE_IMAGE" -ec '
            test "$(id -u)" -eq 1001
            test "$(pnpm --version)" = 11.19.0
            sqlite3 --version >/dev/null
            test -r scripts/reconcile-github.ts
          '
          status=0
          output="$(docker run --rm "$MAINTENANCE_IMAGE" 2>&1)" || status="$?"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Eq '"event":"github\.reconciliation\.failed"'
          printf '%s\n' "$output" | grep -Eq '"errorCategory":"reconciliation"'
      - name: Start the application image and run its healthcheck
        env:
          APP_IMAGE: knowledge-frontier-app:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          container_name="knowledge-frontier-app-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker container rm --force --volumes "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --env SQLITE_PATH=/data/ci-smoke.db \
            "$APP_IMAGE" >/dev/null
          healthy=0
          for attempt in $(seq 1 30); do
            if docker exec "$container_name" node healthcheck.mjs; then
              healthy=1
              break
            fi
            test "$(docker inspect "$container_name" --format '{{.State.Running}}')" = true
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then
            docker logs "$container_name"
            exit 1
          fi
      - name: Validate Compose image selection and rendered configuration
        env:
          BUILD_APP_IMAGE: knowledge-frontier-app:ci-${{ github.sha }}
          BUILD_MAINTENANCE_IMAGE: knowledge-frontier-maintenance:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          selector_env="$(mktemp)"
          trap 'rm -f -- "$selector_env"' EXIT
          printf 'APP_IMAGE=%s\nMAINTENANCE_IMAGE=%s\nAPP_ENV_FILE=./deploy/.env.example\n' \
            "$BUILD_APP_IMAGE" "$BUILD_MAINTENANCE_IMAGE" >"$selector_env"
          APP_IMAGE=stale-app-selector MAINTENANCE_IMAGE=stale-maintenance-selector \
            ./deploy/scripts/verify-compose-images.sh \
              "$selector_env" "$BUILD_APP_IMAGE" "$BUILD_MAINTENANCE_IMAGE"
      - name: Parse the Nginx configuration
        shell: pwsh
        run: ./deploy/nginx/test-config.ps1
      - name: Install the ephemeral SQLite test dependency
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Verify SQLite backup and restore round trip
        run: bash deploy/scripts/test-backup.sh
      - name: Verify maintenance runner behavior
        run: bash deploy/scripts/test-maintenance-runner.sh
      - name: Verify Compose image selection behavior
        run: bash deploy/scripts/test-compose-images.sh
      - name: Validate systemd units
        run: |
          sudo install -d /srv/knowledge-frontier
          sudo ln -s "$GITHUB_WORKSPACE" /srv/knowledge-frontier/current
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
